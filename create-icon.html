<!DOCTYPE html>
<html>
<head>
    <title>Create Icon</title>
</head>
<body>
    <canvas id="canvas" width="192" height="192" style="border: 1px solid #ccc;"></canvas>
    <br>
    <button onclick="downloadIcon()">Download PNG</button>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Create gradient background
        const gradient = ctx.createLinearGradient(0, 0, 192, 192);
        gradient.addColorStop(0, '#3b82f6');
        gradient.addColorStop(1, '#1d4ed8');
        
        // Background with rounded corners
        ctx.fillStyle = gradient;
        ctx.roundRect(0, 0, 192, 192, 32);
        ctx.fill();
        
        // Note paper
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.roundRect(48, 40, 96, 112, 8);
        ctx.fill();
        
        // Text lines
        ctx.fillStyle = 'rgba(59, 130, 246, 0.7)';
        ctx.fillRect(60, 60, 72, 3);
        
        ctx.fillStyle = 'rgba(59, 130, 246, 0.5)';
        ctx.fillRect(60, 72, 60, 3);
        ctx.fillRect(60, 84, 66, 3);
        ctx.fillRect(60, 96, 48, 3);
        
        // Pen circle
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(140, 120, 16, 0, 2 * Math.PI);
        ctx.fill();
        
        // Pen details
        ctx.fillStyle = 'white';
        ctx.fillRect(132, 112, 16, 8);
        ctx.beginPath();
        ctx.arc(140, 120, 2, 0, 2 * Math.PI);
        ctx.fill();
        
        function downloadIcon() {
            const link = document.createElement('a');
            link.download = 'app.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Add roundRect if not supported
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
                this.beginPath();
                this.moveTo(x + radius, y);
                this.lineTo(x + width - radius, y);
                this.quadraticCurveTo(x + width, y, x + width, y + radius);
                this.lineTo(x + width, y + height - radius);
                this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                this.lineTo(x + radius, y + height);
                this.quadraticCurveTo(x, y + height, x, y + height - radius);
                this.lineTo(x, y + radius);
                this.quadraticCurveTo(x, y, x + radius, y);
                this.closePath();
            };
        }
    </script>
</body>
</html>
