<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Fixes - Memo no Sekai</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success {
            background: #10b981;
            color: white;
        }
        .error {
            background: #ef4444;
            color: white;
        }
        .warning {
            background: #f59e0b;
            color: white;
        }
        button {
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            font-weight: 600;
        }
        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .code {
            background: #1e293b;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            margin: 10px 0;
            overflow-x: auto;
        }
        h1 {
            margin-top: 0;
            color: #3b82f6;
        }
        .check-item {
            padding: 10px;
            margin: 5px 0;
            background: #f3f4f6;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔍 Verify Fixes Are Loaded</h1>
        <p>This page checks if the latest code fixes are loaded in your browser.</p>
        
        <div id="cacheStatus" class="status warning">
            Checking cache status...
        </div>
        
        <button onclick="checkFixes()">🔍 Check if Fixes Are Loaded</button>
        <button onclick="window.location.href='index.html?v=' + Date.now()">🚀 Open App (Cache-Busted)</button>
    </div>
    
    <div class="card">
        <h2>📋 Fix Verification Results</h2>
        <div id="results">
            <p>Click "Check if Fixes Are Loaded" to verify...</p>
        </div>
    </div>
    
    <div class="card">
        <h2>🛠️ Force Cache Refresh</h2>
        <p>If fixes are not loaded, try these methods:</p>
        
        <div style="margin: 20px 0;">
            <button onclick="clearCacheAndReload()">🗑️ Clear Cache & Reload</button>
            <button onclick="openIncognito()">🕵️ Instructions for Incognito</button>
            <button onclick="disableCacheInstructions()">⚙️ Disable Cache Instructions</button>
        </div>
    </div>
    
    <script>
        async function checkFixes() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Checking...</p>';
            
            try {
                // Fetch the app.js file with cache-busting
                const response = await fetch('app.js?v=' + Date.now());
                const code = await response.text();
                
                // Check for the 3 fixes
                const fix1 = code.includes('Statistics updated in DOM');
                const fix2 = code.includes('Showing sort menu');
                const fix3 = code.includes('Support both tag: and #');
                
                let html = '<h3>Fix Status:</h3>';
                
                html += `<div class="check-item">
                    <span>1. Statistics Counter Fix</span>
                    <span style="font-size: 24px;">${fix1 ? '✅' : '❌'}</span>
                </div>`;
                
                html += `<div class="check-item">
                    <span>2. Sort Menu Fix</span>
                    <span style="font-size: 24px;">${fix2 ? '✅' : '❌'}</span>
                </div>`;
                
                html += `<div class="check-item">
                    <span>3. Tag Filtering Fix</span>
                    <span style="font-size: 24px;">${fix3 ? '✅' : '❌'}</span>
                </div>`;
                
                const allFixed = fix1 && fix2 && fix3;
                
                if (allFixed) {
                    document.getElementById('cacheStatus').className = 'status success';
                    document.getElementById('cacheStatus').innerHTML = '✅ ALL FIXES ARE IN THE CODE!';
                    
                    html += `
                        <div class="status success" style="margin-top: 20px;">
                            <strong>✅ All 3 fixes are in the server code!</strong><br><br>
                            Your browser is using cached (old) JavaScript.<br><br>
                            <strong>Solution:</strong> Click the "Open App (Cache-Busted)" button above!
                        </div>
                    `;
                } else {
                    document.getElementById('cacheStatus').className = 'status error';
                    document.getElementById('cacheStatus').innerHTML = '❌ Fixes not found in code';
                    
                    html += `
                        <div class="status error" style="margin-top: 20px;">
                            ❌ Some fixes are missing from the server code.
                        </div>
                    `;
                }
                
                results.innerHTML = html;
                
            } catch (error) {
                results.innerHTML = `
                    <div class="status error">
                        ❌ Error checking fixes: ${error.message}
                    </div>
                `;
            }
        }
        
        function clearCacheAndReload() {
            if (confirm('This will clear your browser cache and reload. Continue?')) {
                // Clear localStorage for testing
                const notes = localStorage.getItem('notes');
                
                // Try to clear cache using service worker
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => caches.delete(name));
                    });
                }
                
                // Reload with cache-busting
                window.location.href = 'index.html?v=' + Date.now();
            }
        }
        
        function openIncognito() {
            alert(`To open in Incognito/Private mode:

Mac:
- Chrome: Cmd+Shift+N
- Safari: Cmd+Shift+N
- Firefox: Cmd+Shift+P

Windows/Linux:
- Chrome: Ctrl+Shift+N
- Firefox: Ctrl+Shift+P

Then visit: http://localhost:8000/index.html

This will bypass all cache!`);
        }
        
        function disableCacheInstructions() {
            alert(`To disable cache in DevTools:

1. Press F12 (or Cmd+Option+J on Mac)
2. Click the "Network" tab
3. Check the "Disable cache" checkbox
4. Keep DevTools OPEN
5. Reload the page (Cmd+R or Ctrl+R)

This forces the browser to load fresh files!`);
        }
        
        // Auto-check on load
        window.addEventListener('load', () => {
            setTimeout(checkFixes, 500);
        });
    </script>
</body>
</html>
