<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Test</title>
</head>
<body>
    <h1>JavaScript Loading Test</h1>
    <div id="result">Testing...</div>
    
    <script src="app.js"></script>
    <script>
        setTimeout(() => {
            const result = document.getElementById('result');
            if (typeof MemoNoSekai !== 'undefined') {
                result.innerHTML = '✅ MemoNoSekai class loaded successfully!';
                result.style.color = 'green';
                console.log('Class available:', MemoNoSekai);
            } else {
                result.innerHTML = '❌ MemoNoSekai class NOT loaded!';
                result.style.color = 'red';
            }
        }, 100);
    </script>
</body>
</html>
