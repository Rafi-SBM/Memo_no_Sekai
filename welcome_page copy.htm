<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Boss - Memo no Sekai</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            background-image: radial-gradient(circle, rgba(59, 130, 246, 0.1), rgba(0, 0, 0, 0.7));
        }

        .container {
            text-align: center;
            padding: 20px;
            position: relative;
            opacity: 0;
            transform: translateY(100%);
            animation: unlockSlide 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
            z-index: 2;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        h1, p {
            transition: transform 2s ease-in-out, opacity 2s ease-in-out;
            z-index: 2;
            position: relative;
        }

        h1 {
            color: #3b82f6;
            font-size: 3.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        p {
            font-size: 1.2em;
            margin-bottom: 30px; 
        }



        .unlock-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-radius: 50%;
            background-color: rgba(255, 105, 180, 0.5);
            opacity: 0;
            pointer-events: none;
            animation: unlockGlow 0.8s ease-out 1s forwards, zoomIn 0.3s ease-in 1.5s forwards;
        }

        .star, .shooting-star {
            position: absolute;
            pointer-events: none;
        }

        .star {
            width: 2px;
            height: 2px;
            background-color: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: twinkle 2s linear infinite, drift linear infinite;
            transition: animation-play-state 0.3s ease;
            z-index: 2;
        }

        .star.stop, .shooting-star.stop {
            animation-play-state: paused;
        }

        .shooting-star {
            width: 100px;
            height: 2px;
            background-color: white;
            opacity: 0.6;
            border-radius: 50%;
            animation: shoot 6s linear infinite, twinkle 2s linear infinite;
            transform-origin: left;
            z-index: 1;
            transition: animation-play-state 0.3s ease;
        }

        /* Animation Keyframes */
        @keyframes unlockSlide {
            0% {
                opacity: 0;
                transform: translateY(100%);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes unlockGlow {
            0% {
                opacity: 0.3;
                width: 0;
                height: 0;
            }
            100% {
                opacity: 0;
                width: 200px;
                height: 200px;
            }
        }

        @keyframes zoomIn {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        @keyframes drift {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        @keyframes twinkle {
            0% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.5;
            }
        }

        @keyframes shoot {
            0% {
                transform: translateX(-100px) rotate(45deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateX(150vw) rotate(45deg);
                opacity: 0;
            }
        }

        /* Continue Exploration Button */
        #continueButton {
            display: none;
            padding: 15px 30px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: transform 2s ease-in-out, opacity 2s ease-in-out, background-color 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            z-index: 3;
            font-family: 'Calibri', sans-serif;
            margin-top: 50px;
            position: relative;
        }

        #continueButton:hover {
            background-color: #2563eb;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            transform: scale(1.05);
        }
        .button-container{
            width:100%;
            display:flex;
            justify-content:center;
            margin-bottom:30px;
        }

        /* Black Hole */
        #blackHole {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-radius: 50%;
            background-color: black;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 0 100px 50px rgba(100, 0, 100, 0.8) inset, 0 0 150px 80px rgba(255, 105, 180, 0.6);
            animation: rotate 6s linear infinite;
            transition: all 1s ease-in-out;
        }

        /* Portal Animation */
        @keyframes portalOpen {
            0% {
                border-radius: 50%;
                box-shadow: 0 0 100px 50px rgba(59, 130, 246, 0.8) inset, 0 0 150px 80px rgba(59, 130, 246, 0.6);
            }
            50% {
                border-radius: 45%;
                box-shadow: 0 0 150px 75px rgba(59, 130, 246, 0.8) inset, 0 0 200px 100px rgba(37, 99, 235, 0.8);
            }
            100% {
                border-radius: 5%;
                box-shadow: 0 0 200px 100px rgba(37, 99, 235, 1) inset, 0 0 300px 150px rgba(37, 99, 235, 1);
            }
        }

        @keyframes portalZoom {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(10);
                opacity: 0;
            }
        }

        @keyframes fadeToBlue {
            0% {
                background-color: black;
            }
            100% {
                background-color: #3b82f6;
            }
        }

        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .black-hole-sparkle {
            position: absolute;
            width: 1px;
            height: 1px;
            background-color: #FF69B4;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: sparkle 2s linear infinite;
        }

        .black-hole-sparkle.swallowed {
            animation: swallowSparkle 1s ease-out forwards;
        }

        @keyframes swallowSparkle {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(0.1);
                opacity: 0;
                width: 0;
                height: 0;
            }
        }

        @keyframes sparkle {
            0% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.3;
            }
        }

        /* Portal inner light effect */
        .portal-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-radius: 50%;
            background-color: #3b82f6;
            opacity: 0;
            z-index: 0;
            transition: all 1.5s ease-in-out;
        }

        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #FF69B4;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loginPrompt {
            display: none;
            text-align: center;
            padding: 20px;
        }

        #loginButton {
            padding: 12px 24px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        #loginButton:hover {
            background-color: #2563eb;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container" id="welcomeContainer">
        <div id="loadingSpinner" class="loading-spinner"></div>
        <div class="unlock-glow"></div>

        <h1 id="welcomeMessage">Welcome Boss!</h1>
        <p id="paragraph">Ready to organize your thoughts?</p>
        <div class="button-container">
            <button id="continueButton">Let's Begin</button>
        </div>
    </div>

    <div id="loginPrompt">
        <h1>Welcome Boss</h1>
        <p>Ready to start your note-taking journey?</p>
        <button id="loginButton">Let's Begin</button>
    </div>

    <div id="blackHole"></div>
    <div class="portal-inner" id="portalInner"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDgzylhHW05EQLuJwVIHdXWbVVeJhpQHxU",
            authDomain: "shortcut-sensei-2459c.firebaseapp.com",
            databaseURL: "https://shortcut-sensei-2459c-default-rtdb.firebaseio.com",
            projectId: "shortcut-sensei-2459c",
            storageBucket: "shortcut-sensei-2459c.firebasestorage.app",
            messagingSenderId: "93261862581",
            appId: "1:93261862581:web:0844aaf7ac50e1eaaed0fc",
            measurementId: "G-K53XF0N322"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // DOM Elements
        const welcomeContainer = document.getElementById("welcomeContainer");
        const loginPrompt = document.getElementById("loginPrompt");
        const welcomeMessage = document.getElementById("welcomeMessage");

        const paragraph = document.getElementById("paragraph");
        const continueButton = document.getElementById("continueButton");
        const blackHole = document.getElementById("blackHole");
        const portalInner = document.getElementById("portalInner");
        const loadingSpinner = document.getElementById("loadingSpinner");
        const loginButton = document.getElementById("loginButton");
        const body = document.body;

        // Create starfield
        createStarfield();

        // Auto-start the welcome experience
        setTimeout(() => {
            loadingSpinner.style.display = "none";
            
            // Show welcome screen directly
            const demoUser = {
                displayName: "Boss",
                email: "boss@memo.app",
                photoURL: null,
                uid: "demo_user"
            };
            
            displayUserWelcome(demoUser);
            saveUserData(demoUser);
        }, 2000);

        // Display welcome screen with user info
        function displayUserWelcome(user) {
            welcomeContainer.style.display = "block";
            
            // Update welcome message with username
            const displayName = user.displayName || "Boss";
            welcomeMessage.textContent = `Welcome Boss!`;
            
            // Update paragraph
            paragraph.textContent = "Ready to organize your thoughts and ideas?";
            

            
            // Show continue button
            setTimeout(() => {
                continueButton.style.display = "block";
                continueButton.style.opacity = "1";
            }, 1500);
        }

        // Save user data to local storage for persistence
        function saveUserData(user) {
            const userData = {
                displayName: user.displayName || "User",
                email: user.email || "",
                photoURL: user.photoURL || "",
                uid: user.uid
            };
            
            // Save to localStorage for persistent data
            localStorage.setItem('userData', JSON.stringify(userData));
            
            // Save to sessionStorage for current session
            sessionStorage.setItem('username', userData.displayName);
            sessionStorage.setItem('userEmail', userData.email);
            sessionStorage.setItem('avatar', userData.photoURL);
        }



        // Create starfield
        function createStarfield() {
            const numStars = 100;
            const stars = [];

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                stars.push(star);

                const size = Math.random() * 2 + 1;
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const delay = Math.random() * 10;
                const driftDuration = Math.random() * 10 + 5;
                const twinkleDuration = Math.random() * 4 + 1;

                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.animationDelay = `${delay}s`;
                star.style.animationDuration = `${driftDuration}s, ${twinkleDuration}s`;

                body.appendChild(star);
            }

            // shooting star
            const shootingStar = document.createElement('div');
            shootingStar.classList.add('shooting-star');
            body.appendChild(shootingStar);
        }

        // Black Hole Animation
        function animateBlackHole() {
            // Find all stars
            const stars = document.querySelectorAll('.star');
            const shootingStar = document.querySelector('.shooting-star');

            stars.forEach(star => star.classList.add('stop'));
            if (shootingStar) shootingStar.classList.add('stop');

            blackHole.style.opacity = "1";
            blackHole.style.transition = "width 2s ease-in-out, height 2s ease-in-out, opacity 1s";
            blackHole.style.width = "400px";
            blackHole.style.height = "400px";

            const elementsToAnimate = [welcomeMessage, paragraph, continueButton];
            const blackHoleRect = blackHole.getBoundingClientRect();
            const blackHoleCenterX = blackHoleRect.left + blackHoleRect.width / 2;
            const blackHoleCenterY = blackHoleRect.top + blackHoleRect.height / 2;

            elementsToAnimate.forEach(element => {
                const elementRect = element.getBoundingClientRect();
                const dx = blackHoleCenterX - (elementRect.left + elementRect.width / 2);
                const dy = blackHoleCenterY - (elementRect.top + elementRect.height / 2);
                element.style.transform = `translate(${dx}px, ${dy}px) scale(0.1)`;
                element.style.opacity = "0";
            });

            // Create and animate sparkles
            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('black-hole-sparkle');
                const x = Math.random() * 400 - 200;
                const y = Math.random() * 400 - 200;
                const randomScale = Math.random() * 0.5 + 0.5;
                sparkle.style.transform = `translate(${x}px, ${y}px) scale(${randomScale})`;
                blackHole.appendChild(sparkle);

                setTimeout(() => sparkle.classList.add("swallowed"), i * 100);
            }

            const totalTransitionTime = 2.5;
            stars.forEach(star => {
                const starRect = star.getBoundingClientRect();
                const dx = blackHoleCenterX - (starRect.left + starRect.width / 2);
                const dy = blackHoleCenterY - (starRect.top + starRect.height / 2);
                const distance = Math.sqrt(dx * dx + dy * dy);
                const duration = totalTransitionTime * (distance / 500);
                star.style.transition = `transform ${duration}s ease-in-out, opacity ${duration}s ease-in-out`;
                star.style.transform = `translate(${dx}px, ${dy}px) scale(0.1)`;
                star.style.opacity = "0";
            });

            if (shootingStar) {
                const shootingStarRect = shootingStar.getBoundingClientRect();
                const dx = blackHoleCenterX - (shootingStarRect.left + shootingStarRect.width / 2);
                const dy = blackHoleCenterY - (shootingStarRect.top + shootingStarRect.height / 2);
                const distance = Math.sqrt(dx * dx + dy * dy);
                const shootingStarDuration = totalTransitionTime * (distance / 500);
                shootingStar.style.transition = `transform ${shootingStarDuration}s ease-in-out, opacity ${shootingStarDuration}s ease-in-out`;
                shootingStar.style.transform = `translate(${dx}px, ${dy}px) scale(0.1)`;
                shootingStar.style.opacity = "0";
            }

            // Start portal animation after stars are absorbed
            setTimeout(animatePortal, totalTransitionTime * 1000);
        }

        // Portal Animation
        function animatePortal() {
            // Stop the rotation animation
            blackHole.style.animation = "none";
            
            // Animate the portal opening - change to blue immediately
            blackHole.style.animation = "portalOpen 1.5s ease-in-out forwards";
            
            // Show the inner blue light instead of pink
            portalInner.style.width = "200px";
            portalInner.style.height = "200px";
            portalInner.style.opacity = "0.7";
            portalInner.style.backgroundColor = "#3b82f6"; // Blue instead of pink
            
            // After portal is open, zoom in and navigate immediately
            setTimeout(() => {
                blackHole.style.animation = "portalZoom 1.2s ease-in-out forwards";
                portalInner.style.width = "300px";
                portalInner.style.height = "300px";
                portalInner.style.opacity = "1";
                
                // Fade the background to blue instead of pink
                body.style.animation = "fadeToBlue 1s ease-in-out forwards";
                
                // Navigate to Memo no Sekai application when blue glow appears
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800); // Reduced time to navigate when blue appears
            }, 1000); // Reduced delay
        }

        // Skip authentication and go directly to app
        function skipToApp() {
            // Simulate user data for demo
            const demoUser = {
                displayName: "Boss",
                email: "boss@memo.app",
                photoURL: null,
                uid: "demo_user"
            };
            
            displayUserWelcome(demoUser);
            saveUserData(demoUser);
        }

        // Event Listeners
        continueButton.addEventListener("click", animateBlackHole);
        loginButton.addEventListener("click", skipToApp);
    </script>
</body>
</html>
